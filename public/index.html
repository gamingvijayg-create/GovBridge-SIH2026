    // ==========================================

    function StartupRegisterPage() {
      const [step, setStep] = useState(1);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const [formData, setFormData] = useState({
        startupName: '',
        founderName: '',
        phone: '',
        location: '',
        sector: 'AgriTech',
        description: '',
        dpiitRegistered: true,
        dpiitNumber: '',
        turnover: '50 Lakhs',
        experienceYears: 4,
        resumeText: ''
      });

      const [file, setFile] = useState(null);
      const [teamMembers, setTeamMembers] = useState([
        { name: '', role: 'Founder & Tech Lead', skills: 'AI, React, Node.js', experienceYears: 5 }
      ]);

      const handleAddTeamMember = () => {
        setTeamMembers([...teamMembers, { name: '', role: 'Software Engineer', skills: '', experienceYears: 1 }]);
      };

      const handleRemoveTeamMember = (index) => {
        setTeamMembers(teamMembers.filter((_, i) => i !== index));
      };

      const handleSubmitEvaluation = async () => {
        setLoading(true);
        const data = new FormData();
        Object.keys(formData).forEach(key => data.append(key, formData[key]));
        data.append('teamMembers', JSON.stringify(teamMembers));
        if (file) data.append('file', file);

        try {
          const res = await fetch('/api/startups/evaluate', {
            method: 'POST',
            body: data
          });
          const json = await res.json();
          setLoading(false);
          if (json.success) {
            setResult(json);
            setStep(4);
          } else {
            alert('Error: ' + json.error);
          }
        } catch (err) {
          setLoading(false);
          alert('Network Error: ' + err.message);
        }
      };

                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.turnover} onChange={e=>setFormData({...formData, turnover: e.target.value})} placeholder="e.g. 60 Lakhs" />
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-700">Startup Executive Overview</label>
                  <textarea className="w-full mt-1 p-3 border border-slate-200 rounded-xl h-24 text-xs outline-none focus:border-blue-600" value={formData.description} onChange={e=>setFormData({...formData, description: e.target.value})} placeholder="Briefly describe your product, target domain, and technology capability..."></textarea>
                </div>

                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(2)} className="ml-auto px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                    Next: Team Info →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 2: Team Members */}
            {step === 2 && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg text-slate-900">Step 2: Team Information</h3>
                  <button onClick={handleAddTeamMember} className="text-xs font-bold text-blue-600 border border-blue-200 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100">
                    + Add Team Member
                  </button>
                </div>

                {teamMembers.map((member, index) => (
                  <div key={index} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 relative">
                    {teamMembers.length > 1 && (
                      <button onClick={()=>handleRemoveTeamMember(index)} className="absolute top-3 right-3 text-xs text-rose-600 font-bold">
                        ✕ Remove
                      </button>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs font-semibold">
                      <div>
                        <label>Member Name</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.name} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].name = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Rahul Sharma" />
                      </div>
                      <div>
                        <label>Role</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.role} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].role = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Lead Architect" />
                      </div>
                      <div>
                        <label>Key Skills</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.skills} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].skills = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Python, OpenCV, Cloud" />
                      </div>
                    </div>
                  </div>
                ))}

                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(1)} className="px-6 py-3 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl">
                    ← Back
                  </button>
                  <button onClick={()=>setStep(3)} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md">
                    Next: Upload Document →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 3: Resume / Document Upload */}
            {step === 3 && (
              <div className="space-y-6">
                <h3 className="font-bold text-lg text-slate-900">Step 3: Company Profile / Resume Document</h3>
                
                <div className="border-2 border-dashed border-blue-300 bg-blue-50/50 rounded-2xl p-8 text-center cursor-pointer" onClick={()=>document.getElementById('fileUpload').click()}>
                  <div className="text-4xl">📁</div>
                  <div className="text-sm font-bold text-slate-800 mt-2">
                    {file ? `Selected File: ${file.name}` : 'Click or Drag & Drop Resume File (.pdf, .docx, .txt)'}
                  </div>
                  <div className="text-xs text-slate-500 mt-1">Maximum file size: 10MB</div>
                  <input type="file" id="fileUpload" accept=".pdf,.docx,.txt" className="hidden" onChange={e=>setFile(e.target.files[0])} />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-700">Or Paste Resume / Capability Details Text</label>
                  <textarea className="w-full mt-1 p-3 border border-slate-200 rounded-xl h-28 text-xs outline-none focus:border-blue-600" value={formData.resumeText} onChange={e=>setFormData({...formData, resumeText: e.target.value})} placeholder="Paste technical expertise, past government projects, turnover proof text..."></textarea>

                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(2)} className="px-6 py-3 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl">
                    ← Back
                  </button>
                  <button onClick={handleSubmitEvaluation} disabled={loading} className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20">
                    {loading ? '⚡ Running Groq AI Evaluation...' : '⚡ Submit for Evaluation →'}
                  </button>
                </div>
              </div>
            )}

            {/* STEP 4: Evaluation Results Display */}
            {step === 4 && result && (
              <div className="space-y-6">
                <div className="text-center space-y-2">
                  <div className="text-5xl">{result.eligibilityResult.isEligible ? '🎉' : '⚠️'}</div>
                  <h3 className="text-2xl font-bold text-slate-900">Evaluation Result</h3>
                </div>

                {/* Data Mismatch Warning Banner */}
                {result.eligibilityResult.mismatchWarnings && result.eligibilityResult.mismatchWarnings.length > 0 && (
                  <div className="bg-amber-50 border-2 border-amber-400 p-5 rounded-2xl space-y-2 text-amber-900 shadow-sm">
                    <div className="flex items-center gap-2 font-black text-sm text-amber-900 uppercase tracking-wide">
                      <span>⚠️ DETAIL MISMATCH DETECTED (REGISTER FORM VS RESUME TEXT)</span>
                    </div>
                    <p className="text-xs text-amber-800 font-medium">
                      The details provided in your registration form do not match the parsed resume document:
                    </p>
                    <ul className="list-disc pl-5 text-xs font-semibold space-y-1 text-amber-900">
                      {result.eligibilityResult.mismatchWarnings.map((warn, i) => (
                        <li key={i}>{warn}</li>
                      ))}
                    </ul>
                  </div>
                )}

                <div className={`p-6 rounded-2xl border ${result.eligibilityResult.isEligible ? 'bg-emerald-50 border-emerald-200 text-emerald-900':'bg-rose-50 border-rose-200 text-rose-900'} space-y-4`}>
                  <div className="flex justify-between items-center">
                    <span className="font-extrabold text-lg">
                      {result.eligibilityResult.isEligible ? '🟢 ELIGIBLE & SHORTLISTED' : '🔴 INELIGIBLE (FILTERED OUT)'}
                    </span>
                    <span className="text-3xl font-black">{result.eligibilityResult.eligibilityScore} / 100</span>
                  </div>

                  <p className="text-xs leading-relaxed font-medium">
                    <b>AI Reasoning:</b> {result.eligibilityResult.reasoning}
                  </p>

                  {!result.eligibilityResult.isEligible && result.eligibilityResult.rejectionReasons && (
                    <div className="space-y-1 pt-2">
                      <div className="text-xs font-bold text-rose-800">Rejection Reasons:</div>
                      <ul className="list-disc pl-5 text-xs">
                        {result.eligibilityResult.rejectionReasons.map((r,i)=><li key={i}>{r}</li>)}
                      </ul>
                    </div>
                  )}
                </div>

                {/* Low Score Improvement Guide & Actionable Recommendations */}
                {result.eligibilityResult.improvementGuide && (
                  <div className="bg-slate-900 text-white p-6 rounded-2xl space-y-4 shadow-xl border border-slate-800">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                      <h4 className="font-extrabold text-sm text-amber-400 uppercase tracking-wide flex items-center gap-2">
                        <span>💡 Score Improvement Guide & Actionable Recommendations</span>
                      </h4>
                      <span className="text-[10px] bg-amber-400/20 text-amber-300 px-2.5 py-1 rounded-full font-bold">Feedback System</span>
                    </div>

                    <p className="text-xs text-slate-300 leading-relaxed font-medium">
                      {result.eligibilityResult.improvementGuide.summary}
                    </p>

                    {result.eligibilityResult.improvementGuide.actionableSteps && result.eligibilityResult.improvementGuide.actionableSteps.length > 0 && (
                      <div className="space-y-2">
                        <div className="text-xs font-bold text-emerald-400">Targeted Actions to Achieve >80 Eligibility Score:</div>
                        <ul className="space-y-1.5 text-xs text-slate-200">
                          {result.eligibilityResult.improvementGuide.actionableSteps.map((step, i) => (
                            <li key={i} className="flex items-start gap-2 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700">
                              <span className="text-emerald-400 font-bold">🎯 Step {i+1}:</span>
                              <span>{step}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}

                    {result.eligibilityResult.improvementGuide.suggestedSchemes && result.eligibilityResult.improvementGuide.suggestedSchemes.length > 0 && (
                      <div className="space-y-2 pt-2 border-t border-slate-800">
                        <div className="text-xs font-bold text-blue-400">Recommended Government Support Schemes & Incubation Grants:</div>
                        <div className="flex flex-wrap gap-2">
                          {result.eligibilityResult.improvementGuide.suggestedSchemes.map((scheme, i) => (
                            <span key={i} className="text-[11px] bg-blue-900/60 border border-blue-700/60 text-blue-200 px-3 py-1.5 rounded-lg font-semibold">
                              🏛️ {scheme}
                            </span>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* Recommended Problem Statements */}
                <div className="space-y-3 pt-4">
                  <h4 className="font-bold text-slate-900 text-sm">Recommended Government Problem Statements:</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {result.recommendedProblemStatements.map((ps) => (
                      <div key={ps.id} className="bg-white border border-slate-200 p-4 rounded-xl space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-bold text-blue-600">{ps.category}</span>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">Min {ps.minimumExperience} Yrs</span>
                        </div>
                        <div className="font-bold text-slate-900 text-sm">{ps.title}</div>
                        <div className="text-xs text-slate-500">{ps.department}</div>
                        <a href="#/problem-statements" className="inline-block text-xs font-bold text-blue-600 mt-2">View & Apply →</a>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="text-center pt-4">
                  <a href="#/problem-statements" className="inline-block px-8 py-3.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md">
                    Explore Problem Statements Explorer →
                  </a>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // ADMIN DASHBOARD PAGE
    // ==========================================
    function AdminDashboardPage({ user }) {
      const [applications, setApplications] = useState([]);
      const [shortlisted, setShortlisted] = useState([]);
      const [problemStatements, setProblemStatements] = useState([]);
      const [stats, setStats] = useState({});
      const [sectorFilter, setSectorFilter] = useState('All');
      const [dpiitFilter, setDpiitFilter] = useState('false');
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [adminNotes, setAdminNotes] = useState('');
      
      // New Problem Statement Form State
      const [showAddPsModal, setShowAddPsModal] = useState(false);
      const [psTitle, setPsTitle] = useState('');
      const [psDept, setPsDept] = useState('');
      const [psCat, setPsCat] = useState('AgriTech');
      const [psDesc, setPsDesc] = useState('');
      const [psSkills, setPsSkills] = useState('');
      const [psMinExp, setPsMinExp] = useState(3);
      const [psDpiit, setPsDpiit] = useState('true');
      const [psTurnover, setPsTurnover] = useState('40 Lakhs');
      const [psDeadline, setPsDeadline] = useState('Q4 2026');

      const fetchAdminData = () => {
        fetch(`/api/admin/applications?sector=${sectorFilter}&dpiitOnly=${dpiitFilter}`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        })
        .then(r=>r.json())
        .then(d=>{
          if(d.success) {
            setApplications(d.data);
            setStats(d.stats);
          }
        });

        fetch('/api/admin/shortlisted', {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        })
        .then(r=>r.json())
        .then(d=>{ if(d.success) setShortlisted(d.data); });

        fetch('/api/problem-statements')
        .then(r=>r.json())
        .then(d=>{ if(d.success) setProblemStatements(d.data); });
      };

      useEffect(() => {
        fetchAdminData();
      }, [sectorFilter, dpiitFilter]);

      const handleShortlistCandidate = async (appId) => {
        try {
          const res = await fetch(`/api/admin/shortlist/${appId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${getToken()}`
            },
            body: JSON.stringify({ adminNotes })
          });
          const json = await res.json();
          if(json.success) {
            alert('Candidate saved to Admin Shortlisted collection!');
            setSelectedCandidate(null);
            fetchAdminData();
          }
        } catch(e) { alert(e.message); }
      };

      const handleAddProblemStatement = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/problem-statements', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${getToken()}`
            },
            body: JSON.stringify({
              title: psTitle,
              department: psDept,
              category: psCat,
              description: psDesc,
              requiredSkills: psSkills,
              minimumExperience: Number(psMinExp),
              dpiitRequired: psDpiit === 'true',
              minimumTurnover: psTurnover,
              deadline: psDeadline
            })
          });
          const json = await res.json();
          if(json.success) {
            alert('✅ New Problem Statement Added Successfully!');
            setShowAddPsModal(false);
            setPsTitle(''); setPsDept(''); setPsDesc(''); setPsSkills('');
            fetchAdminData();
          } else {
            alert('Error: ' + (json.error || 'Failed to add problem statement'));
          }
        } catch(e) { alert(e.message); }
      };

      const handleDeletePs = async (psId) => {
        if(!confirm('Are you sure you want to delete this Problem Statement?')) return;
        try {
          const res = await fetch(`/api/problem-statements/${psId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          const json = await res.json();
          if(json.success) {
            alert('Problem Statement Deleted');
            fetchAdminData();
          }
        } catch(e) { alert(e.message); }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
          <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
              <h2 className="text-3xl font-extrabold text-slate-900">👑 Admin Procurement Dashboard</h2>
              <p className="text-xs text-slate-500 mt-1">Review eligible candidates, save shortlisted startups, and manage problem statements.</p>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={()=>setShowAddPsModal(true)} className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center gap-2 transition">
                ➕ Add New Problem Statement
              </button>
              <span className="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-2 rounded-xl border border-amber-200">
                Admin Logged In
              </span>
            </div>
          </div>

          {/* Overview Stat Cards */}
          <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-slate-500 uppercase">Total Applications</div>
              <div className="text-3xl font-extrabold text-slate-900 mt-1">{stats.totalApplicationsCount || 0}</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-amber-600 uppercase">No. of Selected</div>
              <div className="text-3xl font-extrabold text-amber-600 mt-1">{stats.shortlistedCount || 0}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Shortlisted Candidates</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-rose-600 uppercase">No. of Not Eligible</div>
              <div className="text-3xl font-extrabold text-rose-600 mt-1">{stats.rejectedCount || 0}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Filtered / Rejected</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-emerald-600 uppercase">Eligible Applications</div>
              <div className="text-3xl font-extrabold text-emerald-600 mt-1">{stats.eligibleCount || 0}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Qualified Startups</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl col-span-2 md:col-span-1">
              <div className="text-xs font-bold text-blue-600 uppercase">Active Problem Statements</div>
              <div className="text-3xl font-extrabold text-blue-600 mt-1">{problemStatements.length}</div>
              <div className="text-[10px] text-slate-400 mt-0.5">Live Challenges</div>
            </div>

    // ==========================================
    // PILOT, CONTRACT, PERFORMANCE & SCALE GATE PAGE
    // (End-To-End Lifecycle Matching Reference Diagrams)
    // ==========================================
    function PilotLifecyclePage({ user }) {
      const [pilots, setPilots] = useState([]);
      const [selectedPilot, setSelectedPilot] = useState(null);
      const [activeTab, setActiveTab] = useState('sandbox'); // 'sandbox', 'contract', 'performance', 'payment', 'scale_gate'
      const [loading, setLoading] = useState(true);

      // Forms state
      const [evidenceNotes, setEvidenceNotes] = useState('');
      const [evidenceUrl, setEvidenceUrl] = useState('');
      const [activeMilestoneModal, setActiveMilestoneModal] = useState(null);
      const [scaleDecision, setScaleDecision] = useState('Scale');
      const [scaleJustification, setScaleJustification] = useState('');

      const fetchPilots = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/pilots');
          const json = await res.json();
          if (json.success && json.data) {
            setPilots(json.data);
            if (json.data.length > 0 && !selectedPilot) {
              setSelectedPilot(json.data[0]);
            } else if (selectedPilot) {
              const updated = json.data.find(p => p._id === selectedPilot._id);
              if (updated) setSelectedPilot(updated);
            }
          }
        } catch(err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchPilots();
      }, []);

      const handleRequestPayment = async (milestoneId) => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/milestones/${milestoneId}/request-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ evidenceNotes, evidenceUrl })
          });
          const json = await res.json();
          if (json.success) {
            alert('✅ Payment Request submitted to Department Admin!');
            setActiveMilestoneModal(null);
            setEvidenceNotes('');
            setEvidenceUrl('');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleApprovePayment = async (milestoneId) => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/milestones/${milestoneId}/approve-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const json = await res.json();
          if (json.success) {
            alert('🎉 Milestone Payment Approved & Funds Disbursed!');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleScaleDecisionSubmit = async () => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/scale-up-decision`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              decision: scaleDecision,
              justification: scaleJustification,
              validatorNotes: 'Independent Committee Audit completed.'
            })
          });
          const json = await res.json();
          if (json.success) {
            alert(`🚀 Scale-Up Gate Decision recorded: ${scaleDecision}!`);
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      if (loading) {
        return (
          <div className="max-w-7xl mx-auto px-4 py-20 text-center">
            <div className="text-xl font-bold text-slate-700 animate-pulse">Loading Pilot & Milestone Data...</div>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 space-y-10">
          
          {/* Header Banner */}
          <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-900 rounded-3xl p-8 text-white shadow-xl relative overflow-hidden">
            <div className="relative z-10 space-y-4">
              <div className="flex items-center gap-3">
                <span className="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30 uppercase tracking-widest">
                  SIH 2026 End-to-End Lifecycle
                </span>
                <span className="text-xs text-slate-400">GovBridge NextGen Architecture</span>
              </div>
              <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">
                Pilot, Contract, Performance & Scale Gate Manager
              </h1>
              <p className="text-slate-300 max-w-3xl text-sm leading-relaxed">
                GovBridge captures structural lifecycle evidence at every stage: from outcome specifications and KPI baseline tracking, to milestone-linked payments and compliant scale-up tender transition.
              </p>
            </div>
          </div>

          {/* End-to-End Lifecycle Stepper Visualizer (Matching Slide 2 & 3) */}
          <div className="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">

                { step: '5', title: 'Pilot / Sandbox', active: activeTab === 'sandbox' },
                { step: '6', title: 'Milestone Contract', active: activeTab === 'contract' },
                { step: '7', title: 'KPI Tracker', active: activeTab === 'performance' },

                        <span>🎯</span> Outcome Objective
                      </div>
                      <p className="text-slate-600 leading-relaxed">{selectedPilot.outcomeObjective || 'Not specified'}</p>

                        <span className="text-xs font-bold bg-blue-100 text-blue-700 px-2.5 py-0.5 rounded-lg">
                          {step.code}
                        </span>
                        <span className="text-2xl">{step.icon}</span>
                      </div>
                      <h4 className="font-extrabold text-slate-900 text-sm leading-snug">{step.title}</h4>
                      <p className="text-xs text-slate-600 leading-relaxed">{step.summary}</p>
                      
                      <div className="pt-2 text-[11px] font-bold text-blue-600 flex items-center gap-1">
                        <span>Inspect Step Mechanics</span> <span>→</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* CONDITIONAL DECISION BRANCH GATE (STAGE 8 TO 9 SPLIT) */}
            <div className="bg-gradient-to-r from-amber-50 via-slate-50 to-emerald-50 border-2 border-amber-200 rounded-3xl p-8 space-y-6 relative">
              <div className="text-center max-w-xl mx-auto space-y-2">
                <div className="inline-block bg-amber-500 text-white font-extrabold text-xs px-4 py-1 rounded-full uppercase tracking-widest shadow-sm">
                  ⚡ Key Decision Gate
                </div>
                <h3 className="text-xl font-bold text-slate-900">Pilot Evaluation: Is Pilot Successful?</h3>
                <p className="text-xs text-slate-600">
                  After Stage 8 (Milestone Payment Request), the independent evaluation committee audits measured KPI performance against baseline targets.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                {/* YES BRANCH */}
                <div className="bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-6 space-y-4">
                  <div className="flex items-center gap-2 text-emerald-800 font-extrabold text-sm">
                    <span className="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs">✓</span>
                    YES: Target KPIs Met & Evidence Validated
                  </div>
                  <p className="text-xs text-emerald-900 leading-relaxed">
                    Proceeds directly to Stage 9 (Independent Validation), Stage 10 (Procurement Transition), and Stage 11 (GeM Scale-Up Tender Bridge).
                  </p>
                </div>

                {/* NO BRANCH */}
                <div className="bg-rose-50 border-2 border-rose-300 rounded-2xl p-6 space-y-4">
                  <div className="flex items-center gap-2 text-rose-800 font-extrabold text-sm">
                    <span className="w-7 h-7 rounded-full bg-rose-600 text-white flex items-center justify-center text-xs">✕</span>
                    NO: Partial Success / Targets Missed
                  </div>
                  <div className="grid grid-cols-3 gap-2 text-center text-[11px] font-bold">
                    <div className="bg-white p-2 rounded-lg border border-rose-200 text-slate-800">
                      🔄 Extend
                      <div className="text-[9px] text-slate-500 font-normal">Adjust timeline</div>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-rose-200 text-slate-800">
                      🛠️ Redesign
                      <div className="text-[9px] text-slate-500 font-normal">Modify SOW</div>
                    </div>
                    <div className="bg-white p-2 rounded-lg border border-rose-200 text-rose-700">
                      🛑 Stop
                      <div className="text-[9px] text-slate-500 font-normal">End engagement</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            {/* STAGES 9 to 11: VALIDATION & SCALE-UP GATE */}
            <div className="space-y-6 pt-4">
              <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 border-b border-slate-100 pb-2">
                Phase 2: Independent Validation, Procurement & Scale-Up Gate (Stages 9 - 11)
              </h3>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {lifecycleSteps.slice(8, 11).map((step) => {
                  const isFiltered = perspective !== 'all' && step.category !== 'all' && step.category !== perspective;
                  return (
                    <div
                      key={step.id}
                      onClick={() => setSelectedStep(step)}
                      className={`relative bg-emerald-50/50 border-2 rounded-2xl p-5 cursor-pointer transition transform hover:-translate-y-1 hover:shadow-lg space-y-3 ${
                        isFiltered ? 'opacity-40 grayscale' : 'border-emerald-200 hover:border-emerald-500 bg-white'
                      }`}
                    >
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold bg-emerald-100 text-emerald-800 px-2.5 py-0.5 rounded-lg">
                          {step.code}
                        </span>
                        <span className="text-2xl">{step.icon}</span>
                      </div>
                      <h4 className="font-extrabold text-slate-900 text-sm leading-snug">{step.title}</h4>
                      <p className="text-xs text-slate-600 leading-relaxed">{step.summary}</p>
                      
                      <div className="pt-2 text-[11px] font-bold text-emerald-700 flex items-center gap-1">
                        <span>Inspect Step Mechanics</span> <span>→</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* STEP INSPECTOR MODAL */}
          {selectedStep && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-2xl w-full space-y-6 relative shadow-2xl animate-fade-in">
                <button 
                  onClick={() => setSelectedStep(null)}
                  className="absolute top-6 right-6 w-8 h-8 rounded-full bg-slate-100 text-slate-500 hover:bg-slate-200 font-bold flex items-center justify-center"
                >
                  ✕
                </button>

                <div className="flex items-center gap-3 border-b border-slate-100 pb-4">
                  <span className="text-3xl">{selectedStep.icon}</span>
                  <div>
                    <span className="text-xs font-bold text-blue-600 uppercase tracking-widest">{selectedStep.code}</span>
                    <h3 className="text-xl font-extrabold text-slate-900">{selectedStep.title}</h3>
                  </div>
                </div>

                <div className="space-y-4 text-xs">
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div className="font-bold text-slate-800 mb-1">Overview Summary</div>
                    <div className="text-slate-600 leading-relaxed">{selectedStep.summary}</div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100 space-y-1">
                      <div className="font-bold text-blue-900">👤 Key Responsible Actor</div>
                      <div className="text-slate-700 font-semibold">{selectedStep.details.actor}</div>
                    </div>

                    <div className="bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 space-y-1">
                      <div className="font-bold text-indigo-900">📜 Policy & Compliance Standard</div>
                      <div className="text-slate-700 font-semibold">{selectedStep.details.compliance}</div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-1">
                      <div className="font-bold text-slate-800">📥 Data Inputs</div>
                      <div className="text-slate-600">{selectedStep.details.inputs}</div>
                    </div>

                    <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-1">
                      <div className="font-bold text-slate-800">📤 Generated Outputs</div>
                      <div className="text-slate-600">{selectedStep.details.outputs}</div>
                    </div>
                  </div>

                  <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-1">
                    <div className="font-bold text-emerald-900">💾 System Data Saved & Verified</div>
                    <div className="text-emerald-800 font-semibold">{selectedStep.details.dataCaptured}</div>
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button 
                    onClick={() => setSelectedStep(null)}
                    className="px-6 py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl shadow-md"
                  >
                    Close Inspector
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // LOGIN & SIGNUP PAGES
    // ==========================================
    function LoginPage({ setAuthUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const json = await res.json();
          if (json.success) {
            setAuth(json.token, json.user);
            setAuthUser(json.user);
            if (json.user.role === 'admin') window.location.hash = '#/admin/dashboard';
            else window.location.hash = '#/startup/register';
          } else {
            alert('Login failed: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16">
          <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl space-y-6">
            <h2 className="text-2xl font-bold text-slate-900 text-center">Login to GovBridge</h2>
            
            <form onSubmit={handleLogin} className="space-y-4 text-xs font-semibold text-slate-700">
              <div>
                <label>Email Address</label>
                <input type="email" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@govbridge.gov.in or startup@mail.com" />
              </div>
              <div>
                <label>Password</label>
                <input type="password" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                Sign In →
              </button>
            </form>

            <div className="text-center text-xs text-slate-500 pt-2">
              Default Admin: <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">admin@govbridge.gov.in</code> / <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">Admin@123456</code>
            </div>
          </div>
        </div>
      );
    }

    // FOOTER COMPONENT
    function Footer() {
      return (
        <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
            <div className="font-bold text-white text-lg">GovBridge — NextGen Procurement Platform</div>
            <p className="text-xs max-w-xl mx-auto text-slate-400">
              Aligning Indian Startup Innovation with Central & State Government Department Procurement Needs. Built for SIH 2026.
            </p>
            <div className="text-xs text-slate-600 pt-4">© 2026 GovBridge. All rights reserved.</div>
          </div>
        </footer>
      );
    }

    // MAIN APP ROUTER
    function App() {
      const [currentPath, setCurrentPath] = useState(window.location.hash.replace('#', '') || '/');
      const [authUser, setAuthUser] = useState(getUser());

      useEffect(() => {
        const handleHashChange = () => {
          setCurrentPath(window.location.hash.replace('#', '') || '/');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Navbar currentPath={currentPath} user={authUser} />
            <main>
              {currentPath === '/' && <HomePage />}
              {currentPath === '/login' && <LoginPage setAuthUser={setAuthUser} />}
              {currentPath === '/startup/register' && <StartupRegisterPage />}
              {currentPath === '/problem-statements' && <ProblemStatementsPage />}
              {currentPath === '/pilots' && <PilotLifecyclePage user={authUser} />}
              {currentPath === '/how-it-works' && <HowItWorksPage />}
              {currentPath === '/admin/dashboard' && <AdminDashboardPage user={authUser} />}
            </main>
          </div>
          <Footer />
        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootElement).render(<App />);
      } else if (ReactDOM.render) {
        ReactDOM.render(<App />, rootElement);
      }
    } catch(err) {
      console.error('Mounting Error:', err);
    }
  </script>
</body>
</html>
