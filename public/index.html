    // ==========================================
    // MULTI-STEP STARTUP REGISTRATION & EVALUATION
    // ==========================================
    function StartupRegisterPage() {
      const [step, setStep] = useState(1);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);

      const [formData, setFormData] = useState({
        startupName: '',
        founderName: '',
        phone: '',
        location: '',
        sector: 'AgriTech',
        description: '',
        dpiitRegistered: true,
        dpiitNumber: '',
        turnover: '50 Lakhs',
        experienceYears: 4,
        resumeText: ''
      });

      const [file, setFile] = useState(null);
      const [teamMembers, setTeamMembers] = useState([
        { name: '', role: 'Founder & Tech Lead', skills: 'AI, React, Node.js', experienceYears: 5 }
      ]);

      const handleAddTeamMember = () => {
        setTeamMembers([...teamMembers, { name: '', role: 'Software Engineer', skills: '', experienceYears: 1 }]);
      };

      const handleRemoveTeamMember = (index) => {
        setTeamMembers(teamMembers.filter((_, i) => i !== index));
      };

      const handleSubmitEvaluation = async () => {
        setLoading(true);
        const data = new FormData();
        Object.keys(formData).forEach(key => data.append(key, formData[key]));
        data.append('teamMembers', JSON.stringify(teamMembers));
        if (file) data.append('file', file);

        try {
          const res = await fetch('/api/startups/evaluate', {
            method: 'POST',
            body: data
          });
          const json = await res.json();
          setLoading(false);
          if (json.success) {
            setResult(json);
            setStep(4);
          } else {
            alert('Error: ' + json.error);
          }
        } catch (err) {
          setLoading(false);
          alert('Network Error: ' + err.message);
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-12">
          <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl space-y-8">
            {/* Multi-step Header Indicator */}

              <h2 className="text-2xl font-bold text-slate-900">Startup Registration & AI Evaluation</h2>
              <p className="text-xs text-slate-500 mt-1">Complete profile submission to evaluate eligibility and discover matching problem statements.</p>
              
              <div className="grid grid-cols-4 gap-2 mt-6">
                <div className={`h-2 rounded-full ${step>=1?'bg-blue-600':'bg-slate-200'}`}></div>
                <div className={`h-2 rounded-full ${step>=2?'bg-blue-600':'bg-slate-200'}`}></div>
                <div className={`h-2 rounded-full ${step>=3?'bg-blue-600':'bg-slate-200'}`}></div>
                <div className={`h-2 rounded-full ${step>=4?'bg-blue-600':'bg-slate-200'}`}></div>
              </div>

                <span>1. Startup Info</span>
                <span>2. Team Info</span>
                <span>3. Resume Document</span>
                <span>4. Evaluation</span>
              </div>
            </div>

            {/* STEP 1: Startup Information */}
            {step === 1 && (
              <div className="space-y-6">
                <h3 className="font-bold text-lg text-slate-900">Step 1: Startup & Founder Details</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs font-semibold text-slate-700">
                  <div>
                    <label>Startup Name *</label>
                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.startupName} onChange={e=>setFormData({...formData, startupName: e.target.value})} placeholder="e.g. TechNova Solutions Pvt Ltd" />
                  </div>
                  <div>
                    <label>Founder Name *</label>
                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.founderName} onChange={e=>setFormData({...formData, founderName: e.target.value})} placeholder="e.g. Vijay Sarathi" />
                  </div>
                  <div>
                    <label>Phone Number</label>
                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.phone} onChange={e=>setFormData({...formData, phone: e.target.value})} placeholder="+91 9876543210" />
                  </div>
                  <div>
                    <label>Location / City</label>
                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.location} onChange={e=>setFormData({...formData, location: e.target.value})} placeholder="e.g. Bengaluru, India" />
                  </div>
                  <div>
                    <label>Startup Sector *</label>
                    <select className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.sector} onChange={e=>setFormData({...formData, sector: e.target.value})}>
                      <option value="AgriTech">AgriTech</option>
                      <option value="HealthTech">HealthTech</option>
                      <option value="CleanTech">CleanTech</option>
                      <option value="FinTech">FinTech</option>
                      <option value="Software">Software & AI</option>
                    </select>
                  </div>
                  <div>

                  </div>
                  <div>
                    <label>DPIIT Registered Startup?</label>
                    <select className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={formData.dpiitRegistered} onChange={e=>setFormData({...formData, dpiitRegistered: e.target.value==='true'})}>

                      <option value="false">No (Not Registered)</option>

                  </div>
                  <div>

                <div className="flex justify-between pt-4">

                    Next: Team Info →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 2: Team Members */}
            {step === 2 && (
              <div className="space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-lg text-slate-900">Step 2: Team Information</h3>

                </div>

                {teamMembers.map((member, index) => (
                  <div key={index} className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 relative">
                    {teamMembers.length > 1 && (
                      <button onClick={()=>handleRemoveTeamMember(index)} className="absolute top-3 right-3 text-xs text-rose-600 font-bold">
                        ✕ Remove
                      </button>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs font-semibold">
                      <div>
                        <label>Member Name</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.name} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].name = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Rahul Sharma" />
                      </div>
                      <div>
                        <label>Role</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.role} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].role = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Lead Architect" />
                      </div>
                      <div>
                        <label>Key Skills</label>
                        <input type="text" className="w-full mt-1 p-2.5 border border-slate-200 rounded-lg" value={member.skills} onChange={e=>{
                          const updated = [...teamMembers]; updated[index].skills = e.target.value; setTeamMembers(updated);
                        }} placeholder="e.g. Python, OpenCV, Cloud" />
                      </div>
                    </div>
                  </div>

                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(1)} className="px-6 py-3 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl">
                    ← Back
                  </button>
                  <button onClick={()=>setStep(3)} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md">
                    Next: Upload Document →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 3: Resume / Document Upload */}
            {step === 3 && (
              <div className="space-y-6">
                <h3 className="font-bold text-lg text-slate-900">Step 3: Company Profile / Resume Document</h3>
                
                <div className="border-2 border-dashed border-blue-300 bg-blue-50/50 rounded-2xl p-8 text-center cursor-pointer" onClick={()=>document.getElementById('fileUpload').click()}>
                  <div className="text-4xl">📁</div>
                  <div className="text-sm font-bold text-slate-800 mt-2">
                    {file ? `Selected File: ${file.name}` : 'Click or Drag & Drop Resume File (.pdf, .docx, .txt)'}
                  </div>
                  <div className="text-xs text-slate-500 mt-1">Maximum file size: 10MB</div>
                  <input type="file" id="fileUpload" accept=".pdf,.docx,.txt" className="hidden" onChange={e=>setFile(e.target.files[0])} />
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-700">Or Paste Resume / Capability Details Text</label>
                  <textarea className="w-full mt-1 p-3 border border-slate-200 rounded-xl h-28 text-xs outline-none focus:border-blue-600" value={formData.resumeText} onChange={e=>setFormData({...formData, resumeText: e.target.value})} placeholder="Paste technical expertise, past government projects, turnover proof text..."></textarea>
                </div>

                <div className="flex justify-between pt-4">
                  <button onClick={()=>setStep(2)} className="px-6 py-3 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl">
                    ← Back
                  </button>
                  <button onClick={handleSubmitEvaluation} disabled={loading} className="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-lg shadow-emerald-600/20">
                    {loading ? '⚡ Running Groq AI Evaluation...' : '⚡ Submit for Evaluation →'}
                  </button>
                </div>
              </div>
            )}

            {/* STEP 4: Evaluation Results Display */}
            {step === 4 && result && (
              <div className="space-y-6">
                <div className="text-center space-y-2">
                  <div className="text-5xl">{result.eligibilityResult.isEligible ? '🎉' : '⚠️'}</div>
                  <h3 className="text-2xl font-bold text-slate-900">Evaluation Result</h3>
                </div>

                <div className={`p-6 rounded-2xl border ${result.eligibilityResult.isEligible ? 'bg-emerald-50 border-emerald-200 text-emerald-900':'bg-rose-50 border-rose-200 text-rose-900'} space-y-4`}>
                  <div className="flex justify-between items-center">
                    <span className="font-extrabold text-lg">
                      {result.eligibilityResult.isEligible ? '🟢 ELIGIBLE & SHORTLISTED' : '🔴 INELIGIBLE (FILTERED OUT)'}
                    </span>
                    <span className="text-3xl font-black">{result.eligibilityResult.eligibilityScore} / 100</span>
                  </div>

                  <p className="text-xs leading-relaxed font-medium">
                    <b>AI Reasoning:</b> {result.eligibilityResult.reasoning}
                  </p>

                  {!result.eligibilityResult.isEligible && result.eligibilityResult.rejectionReasons && (
                    <div className="space-y-1 pt-2">
                      <div className="text-xs font-bold text-rose-800">Rejection Reasons:</div>
                      <ul className="list-disc pl-5 text-xs">
                        {result.eligibilityResult.rejectionReasons.map((r,i)=><li key={i}>{r}</li>)}
                      </ul>
                    </div>
                  )}
                </div>

                {/* Recommended Problem Statements */}
                <div className="space-y-3 pt-4">
                  <h4 className="font-bold text-slate-900 text-sm">Recommended Government Problem Statements:</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {result.recommendedProblemStatements.map((ps) => (
                      <div key={ps.id} className="bg-white border border-slate-200 p-4 rounded-xl space-y-2">
                        <div className="text-xs font-bold text-blue-600">{ps.category}</div>
                        <div className="font-bold text-slate-900 text-sm">{ps.title}</div>
                        <div className="text-xs text-slate-500">{ps.department}</div>
                        <a href="#/problem-statements" className="inline-block text-xs font-bold text-blue-600 mt-2">View & Apply →</a>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="text-center pt-4">
                  <a href="#/problem-statements" className="inline-block px-8 py-3.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-md">
                    Explore Problem Statements Explorer →
                  </a>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // ADMIN DASHBOARD PAGE
    // ==========================================
    function AdminDashboardPage({ user }) {
      const [applications, setApplications] = useState([]);
      const [shortlisted, setShortlisted] = useState([]);
      const [problemStatements, setProblemStatements] = useState([]);
      const [stats, setStats] = useState({});
      const [sectorFilter, setSectorFilter] = useState('All');
      const [dpiitFilter, setDpiitFilter] = useState('false');
      const [selectedCandidate, setSelectedCandidate] = useState(null);
      const [adminNotes, setAdminNotes] = useState('');
      
      // New Problem Statement Form State
      const [showAddPsModal, setShowAddPsModal] = useState(false);
      const [psTitle, setPsTitle] = useState('');
      const [psDept, setPsDept] = useState('');
      const [psCat, setPsCat] = useState('AgriTech');
      const [psDesc, setPsDesc] = useState('');
      const [psSkills, setPsSkills] = useState('');
      const [psMinExp, setPsMinExp] = useState(3);
      const [psDpiit, setPsDpiit] = useState('true');
      const [psTurnover, setPsTurnover] = useState('40 Lakhs');
      const [psDeadline, setPsDeadline] = useState('Q4 2026');

      const fetchAdminData = () => {
        fetch(`/api/admin/applications?sector=${sectorFilter}&dpiitOnly=${dpiitFilter}`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        })
        .then(r=>r.json())
        .then(d=>{
          if(d.success) {
            setApplications(d.data);
            setStats(d.stats);
          }
        });

        fetch('/api/admin/shortlisted', {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        })
        .then(r=>r.json())
        .then(d=>{ if(d.success) setShortlisted(d.data); });

        fetch('/api/problem-statements')
        .then(r=>r.json())
        .then(d=>{ if(d.success) setProblemStatements(d.data); });
      };

      useEffect(() => {
        fetchAdminData();
      }, [sectorFilter, dpiitFilter]);

      const handleShortlistCandidate = async (appId) => {
        try {
          const res = await fetch(`/api/admin/shortlist/${appId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${getToken()}`
            },
            body: JSON.stringify({ adminNotes })
          });
          const json = await res.json();
          if(json.success) {
            alert('Candidate saved to Admin Shortlisted collection!');
            setSelectedCandidate(null);
            fetchAdminData();
          }
        } catch(e) { alert(e.message); }
      };

      const handleAddProblemStatement = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/problem-statements', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${getToken()}`
            },
            body: JSON.stringify({
              title: psTitle,
              department: psDept,
              category: psCat,
              description: psDesc,
              requiredSkills: psSkills,
              minimumExperience: Number(psMinExp),
              dpiitRequired: psDpiit === 'true',
              minimumTurnover: psTurnover,
              deadline: psDeadline
            })
          });
          const json = await res.json();
          if(json.success) {
            alert('✅ New Problem Statement Added Successfully!');
            setShowAddPsModal(false);
            setPsTitle(''); setPsDept(''); setPsDesc(''); setPsSkills('');
            fetchAdminData();
          } else {
            alert('Error: ' + (json.error || 'Failed to add problem statement'));
          }
        } catch(e) { alert(e.message); }
      };

      const handleDeletePs = async (psId) => {
        if(!confirm('Are you sure you want to delete this Problem Statement?')) return;
        try {
          const res = await fetch(`/api/problem-statements/${psId}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${getToken()}` }
          });
          const json = await res.json();
          if(json.success) {
            alert('Problem Statement Deleted');
            fetchAdminData();
          }
        } catch(e) { alert(e.message); }
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-8">
          <div className="flex flex-col md:flex-row justify-between md:items-center gap-4">
            <div>
              <h2 className="text-3xl font-extrabold text-slate-900">👑 Admin Procurement Dashboard</h2>
              <p className="text-xs text-slate-500 mt-1">Review eligible candidates, save shortlisted startups, and manage problem statements.</p>
            </div>
            <div className="flex items-center gap-3">
              <button onClick={()=>setShowAddPsModal(true)} className="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center gap-2 transition">
                ➕ Add New Problem Statement
              </button>
              <span className="text-xs font-bold bg-amber-100 text-amber-800 px-3 py-2 rounded-xl border border-amber-200">
                Admin Logged In
              </span>
            </div>
          </div>

          {/* Overview Stat Cards */}
          <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-slate-500 uppercase">Total Applications</div>
              <div className="text-3xl font-extrabold text-slate-900 mt-1">{stats.totalApplicationsCount || 0}</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-emerald-600 uppercase">Eligible Startups</div>
              <div className="text-3xl font-extrabold text-emerald-600 mt-1">{stats.eligibleCount || 0}</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-amber-600 uppercase">Shortlisted Resumes</div>
              <div className="text-3xl font-extrabold text-amber-600 mt-1">{stats.shortlistedCount || 0}</div>
            </div>
            <div className="bg-white border border-slate-200 p-5 rounded-2xl">
              <div className="text-xs font-bold text-blue-600 uppercase">Active Problem Statements</div>
              <div className="text-3xl font-extrabold text-blue-600 mt-1">{problemStatements.length}</div>
            </div>
          </div>

          {/* Active Problem Statements Management Table */}
          <div className="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
            <div className="flex justify-between items-center">
              <div>
                <h3 className="font-bold text-slate-900 text-sm">📋 Manage Government Problem Statements ({problemStatements.length})</h3>
                <p className="text-[11px] text-slate-500">Live problem statements open for startup matching</p>
              </div>
              <button onClick={()=>setShowAddPsModal(true)} className="px-3 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 rounded-lg text-xs font-bold">
                + Create PS
              </button>
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-slate-700">
                    <th className="p-3">Title</th>
                    <th className="p-3">Department</th>
                    <th className="p-3">Category</th>
                    <th className="p-3">Min Exp</th>
                    <th className="p-3">DPIIT</th>
                    <th className="p-3">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {problemStatements.map(ps => (
                    <tr key={ps._id} className="border-b border-slate-100 hover:bg-slate-50">
                      <td className="p-3 font-bold text-slate-900">{ps.title}</td>
                      <td className="p-3 text-slate-600">{ps.department}</td>
                      <td className="p-3"><span className="px-2 py-0.5 bg-slate-100 text-slate-800 rounded font-semibold text-[10px]">{ps.category}</span></td>
                      <td className="p-3 text-slate-600">{ps.minimumExperience} Yrs</td>
                      <td className="p-3">{ps.dpiitRequired ? 'Required' : 'Optional'}</td>
                      <td className="p-3">
                        <button onClick={()=>handleDeletePs(ps._id)} className="px-2.5 py-1 bg-rose-50 text-rose-600 hover:bg-rose-100 border border-rose-200 rounded font-bold">
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Candidate Filters */}
          <div className="bg-white border border-slate-200 rounded-2xl p-6 space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-bold text-slate-900 text-sm">Startup Applications Evaluation</h3>
              <div className="flex gap-3">
                <select className="p-2 border border-slate-200 rounded-lg text-xs" value={sectorFilter} onChange={e=>setSectorFilter(e.target.value)}>
                  <option value="All">All Sectors</option>
                  <option value="AgriTech">AgriTech</option>
                  <option value="HealthTech">HealthTech</option>
                  <option value="CleanTech">CleanTech</option>
                  <option value="FinTech">FinTech</option>
                </select>
                <select className="p-2 border border-slate-200 rounded-lg text-xs" value={dpiitFilter} onChange={e=>setDpiitFilter(e.target.value)}>
                  <option value="false">All DPIIT Status</option>
                  <option value="true">DPIIT Only</option>
                </select>
              </div>
            </div>

            {/* Applications Table */}
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead>
                  <tr className="border-b border-slate-200 bg-slate-50 text-slate-700">
                    <th className="p-3">Startup Name</th>
                    <th className="p-3">Sector</th>
                    <th className="p-3">Experience</th>
                    <th className="p-3">DPIIT</th>
                    <th className="p-3">Score</th>
                    <th className="p-3">Status</th>
                    <th className="p-3">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {applications.map(app => (
                    <tr key={app._id} className="border-b border-slate-100 hover:bg-slate-50">
                      <td className="p-3 font-bold text-slate-900">{app.startupName}</td>
                      <td className="p-3 text-slate-600">{app.sector}</td>
                      <td className="p-3 text-slate-600">{app.experienceYears} Yrs</td>
                      <td className="p-3">{app.dpiitRegistered ? '✅ Yes' : '❌ No'}</td>
                      <td className="p-3 font-extrabold text-blue-600">{app.eligibilityScore}/100</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${app.status==='shortlisted'?'bg-amber-100 text-amber-800':app.status==='eligible'?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}`}>
                          {app.status.toUpperCase()}
                        </span>
                      </td>
                      <td className="p-3">
                        <button onClick={()=>setSelectedCandidate(app)} className="px-3 py-1 bg-blue-600 text-white rounded font-bold hover:bg-blue-700">
                          Review & Shortlist
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* Add Problem Statement Modal */}
          {showAddPsModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-2xl w-full space-y-6 relative max-h-[90vh] overflow-y-auto">
                <button onClick={()=>setShowAddPsModal(false)} className="absolute top-6 right-6 font-bold text-slate-400 hover:text-slate-600">✕</button>
                <div className="space-y-1">
                  <h3 className="text-xl font-bold text-slate-900">➕ Add Government Problem Statement</h3>
                  <p className="text-xs text-slate-500">Create a new problem statement to match with startup capabilities using AI Atlas Vector Search.</p>
                </div>

                <form onSubmit={handleAddProblemStatement} className="space-y-4 text-xs">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="font-semibold text-slate-700">Title</label>
                      <input type="text" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psTitle} onChange={e=>setPsTitle(e.target.value)} placeholder="e.g. AI Smart Water Grid Analytics" />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700">Department</label>
                      <input type="text" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psDept} onChange={e=>setPsDept(e.target.value)} placeholder="e.g. Ministry of Jal Shakti" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                      <label className="font-semibold text-slate-700">Category</label>
                      <select className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psCat} onChange={e=>setPsCat(e.target.value)}>
                        <option value="AgriTech">AgriTech</option>
                        <option value="HealthTech">HealthTech</option>
                        <option value="CleanTech">CleanTech</option>
                        <option value="FinTech">FinTech</option>
                        <option value="SmartCity">SmartCity</option>
                        <option value="E-Gov">E-Gov</option>
                      </select>
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700">Min Experience (Yrs)</label>
                      <input type="number" required min="0" className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psMinExp} onChange={e=>setPsMinExp(e.target.value)} />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700">DPIIT Mandatory?</label>
                      <select className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psDpiit} onChange={e=>setPsDpiit(e.target.value)}>
                        <option value="true">Mandatory</option>
                        <option value="false">Optional</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="font-semibold text-slate-700">Minimum Turnover Requirement</label>
                      <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psTurnover} onChange={e=>setPsTurnover(e.target.value)} placeholder="e.g. 50 Lakhs" />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700">Submission Deadline</label>
                      <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psDeadline} onChange={e=>setPsDeadline(e.target.value)} placeholder="e.g. Q4 2026" />
                    </div>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700">Description / Procurement Scope</label>
                    <textarea required rows="3" className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psDesc} onChange={e=>setPsDesc(e.target.value)} placeholder="Detail the challenge requirements and expected startup solutions..."></textarea>
                  </div>

                  <div>
                    <label className="font-semibold text-slate-700">Required Skills / Keywords (comma separated)</label>
                    <input type="text" className="w-full mt-1 p-3 border border-slate-200 rounded-xl" value={psSkills} onChange={e=>setPsSkills(e.target.value)} placeholder="e.g. IoT, Machine Learning, Sensors, GIS Mapping" />
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onClick={()=>setShowAddPsModal(false)} className="px-5 py-3 border border-slate-200 text-slate-700 font-bold rounded-xl">
                      Cancel
                    </button>
                    <button type="submit" className="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md">
                      💾 Create Problem Statement
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Shortlisting Modal */}
          {selectedCandidate && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-xl w-full space-y-6 relative">
                <button onClick={()=>setSelectedCandidate(null)} className="absolute top-6 right-6 font-bold text-slate-400">✕</button>
                <h3 className="text-xl font-bold text-slate-900">Review Candidate: {selectedCandidate.startupName}</h3>
                
                <div className="text-xs space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                  <div><b>Founder:</b> {selectedCandidate.founderName} ({selectedCandidate.phone})</div>
                  <div><b>Sector:</b> {selectedCandidate.sector} | <b>Experience:</b> {selectedCandidate.experienceYears} Years</div>
                  <div><b>Turnover:</b> {selectedCandidate.turnover} | <b>DPIIT:</b> {selectedCandidate.dpiitRegistered ? 'Yes' : 'No'}</div>
                  <div className="pt-2 text-slate-600"><b>Resume Overview:</b> {selectedCandidate.rawResumeText.slice(0, 200)}...</div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-700">Admin Notes / Shortlisting Reason</label>
                  <textarea className="w-full mt-1 p-3 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-600" value={adminNotes} onChange={e=>setAdminNotes(e.target.value)} placeholder="Add specific note on why this startup is selected for government pilot..."></textarea>
                </div>

                <div className="flex justify-between pt-2">
                  <button onClick={()=>handleShortlistCandidate(selectedCandidate._id)} className="px-6 py-3 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-xl shadow-md">
                    💾 Save to Admin Shortlisted Database
                  </button>
                  <button onClick={()=>setSelectedCandidate(null)} className="px-5 py-3 border border-slate-200 text-slate-700 font-bold text-xs rounded-xl">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // LOGIN & SIGNUP PAGES
    // ==========================================
    function LoginPage({ setAuthUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const json = await res.json();
          if (json.success) {
            setAuth(json.token, json.user);
            setAuthUser(json.user);
            if (json.user.role === 'admin') window.location.hash = '#/admin/dashboard';
            else window.location.hash = '#/startup/register';
          } else {
            alert('Login failed: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16">
          <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl space-y-6">
            <h2 className="text-2xl font-bold text-slate-900 text-center">Login to GovBridge</h2>
            
            <form onSubmit={handleLogin} className="space-y-4 text-xs font-semibold text-slate-700">
              <div>
                <label>Email Address</label>
                <input type="email" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@govbridge.gov.in or startup@mail.com" />
              </div>
              <div>
                <label>Password</label>
                <input type="password" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                Sign In →
              </button>
            </form>

            <div className="text-center text-xs text-slate-500 pt-2">
              Default Admin: <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">admin@govbridge.gov.in</code> / <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">Admin@123456</code>
            </div>
          </div>
        </div>
      );
    }

    // FOOTER COMPONENT
    function Footer() {
      return (
        <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
            <div className="font-bold text-white text-lg">GovBridge — NextGen Procurement Platform</div>
            <p className="text-xs max-w-xl mx-auto text-slate-400">
              Aligning Indian Startup Innovation with Central & State Government Department Procurement Needs. Built for SIH 2026.
            </p>
            <div className="text-xs text-slate-600 pt-4">© 2026 GovBridge. All rights reserved.</div>
          </div>
        </footer>
      );
    }

    // MAIN APP ROUTER
    function App() {
      const [currentPath, setCurrentPath] = useState(window.location.hash.replace('#', '') || '/');
      const [authUser, setAuthUser] = useState(getUser());

      useEffect(() => {
        const handleHashChange = () => {
          setCurrentPath(window.location.hash.replace('#', '') || '/');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Navbar currentPath={currentPath} user={authUser} />
            <main>
              {currentPath === '/' && <HomePage />}
              {currentPath === '/login' && <LoginPage setAuthUser={setAuthUser} />}
              {currentPath === '/startup/register' && <StartupRegisterPage />}
              {currentPath === '/problem-statements' && <ProblemStatementsPage />}
              {currentPath === '/admin/dashboard' && <AdminDashboardPage user={authUser} />}
            </main>
          </div>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
