      // OTP State
      const [isPhoneVerified, setIsPhoneVerified] = useState(false);
      const [isEmailVerified, setIsEmailVerified] = useState(false);
      const [phoneOtpInput, setPhoneOtpInput] = useState('');
      const [emailOtpInput, setEmailOtpInput] = useState('');
      const [phoneDemoOtp, setPhoneDemoOtp] = useState('');
      const [emailDemoOtp, setEmailDemoOtp] = useState('');
      const [showPhoneOtpBox, setShowPhoneOtpBox] = useState(false);
      const [showEmailOtpBox, setShowEmailOtpBox] = useState(false);

      const [teamMembers, setTeamMembers] = useState([
        { name: '', role: 'Founder & Tech Lead', skills: 'AI, React, Node.js', experienceYears: 5 }
      ]);

      const handleAddTeamMember = () => {
        setTeamMembers([...teamMembers, { name: '', role: 'Software Engineer', skills: '', experienceYears: 1 }]);
      };

      const handleRemoveTeamMember = (index) => {
        setTeamMembers(teamMembers.filter((_, i) => i !== index));
      };

                  // OTP Verification Handlers
      const handleSendPhoneOtp = async () => {
        if (!formData.phone.trim()) {
          alert('Please enter a valid Lead Mobile Phone Number first');
          return;
        }
        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: 'phone', value: formData.phone })
          });
          const json = await res.json();
          if (json.success) {
            setShowPhoneOtpBox(true);
            setPhoneOtpInput(''); // Input field is blank for user to type OTP from SMS app
            alert('📱 Verification OTP code dispatched to your Mobile Phone SMS Messenger (' + formData.phone + '). Please check your phone SMS inbox and enter the 6-digit code below.');
          } else { alert('Error: ' + json.error); }
        } catch(err) { alert(err.message); }
      };

      const handleVerifyPhoneOtp = async () => {
        if (!phoneOtpInput.trim()) { alert('Please enter 6-digit OTP code'); return; }
        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: formData.phone, otp: phoneOtpInput })
          });
          const json = await res.json();
          if (json.success) {
            setIsPhoneVerified(true);
            setShowPhoneOtpBox(false);
            alert('✅ Phone Number Verified Successfully!');
          } else { alert('OTP Verification Error: ' + json.error); }
        } catch(err) { alert(err.message); }
      };

      const handleSendEmailOtp = async () => {
        if (!formData.email.trim()) {
          alert('Please enter a valid Email Address first');
          return;
        }
        try {
          const res = await fetch('/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target: 'email', value: formData.email })
          });
          const json = await res.json();
          if (json.success) {
            setShowEmailOtpBox(true);
            setEmailOtpInput(''); // Blank for user to type from Email inbox
            alert('📧 Verification OTP code dispatched to your Email Inbox (' + formData.email + '). Please check your email inbox and enter the 6-digit code below.');
          } else { alert('Error: ' + json.error); }
        } catch(err) { alert(err.message); }
      };

const handleVerifyEmailOtp = async () => {
        if (!emailOtpInput.trim()) { alert('Please enter 6-digit OTP code'); return; }
        try {
          const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ value: formData.email, otp: emailOtpInput })
          });
          const json = await res.json();
          if (json.success) {
            setIsEmailVerified(true);
            setShowEmailOtpBox(false);
            alert('✅ Email Address Verified Successfully!');
          } else { alert('OTP Verification Error: ' + json.error); }
        } catch(err) { alert(err.message); }
      };

      const handleSubmitEvaluation = async () => {
        if (!formData.startupName.trim()) {
          alert('Please enter your Company / Startup Name');
          return;
        }
        if (!isPhoneVerified || !isEmailVerified) {
          alert('⚠️ Please verify BOTH your Phone Number and Email ID using OTP before proceeding.');
          return;
        }

        setLoading(true);

        // First register startup account with Username = Company Name & Hashed Password
        try {
          await fetch('/api/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              companyName: formData.startupName,
              name: formData.startupName,
              email: formData.email,
              password: formData.password || 'Startup@123456',
              phone: formData.phone
            })

        const data = new FormData();
        Object.keys(formData).forEach(key => data.append(key, formData[key]));
        data.append('teamMembers', JSON.stringify(teamMembers));
        if (file) data.append('file', file);

        try {

    // ==========================================
    // PILOT, CONTRACT, PERFORMANCE & SCALE GATE PAGE

    // ==========================================
        function PilotLifecyclePage({ user }) {
      const [pilots, setPilots] = useState([]);
      const [selectedPilot, setSelectedPilot] = useState(null);
      const [activeTab, setActiveTab] = useState('daily_updates'); // 'sandbox', 'daily_updates', 'contract', 'performance', 'payment', 'expenditures', 'scale_gate'
      const [loading, setLoading] = useState(true);

      // Milestone & Scale Gate state
      const [evidenceNotes, setEvidenceNotes] = useState('');
      const [evidenceUrl, setEvidenceUrl] = useState('');
      const [activeMilestoneModal, setActiveMilestoneModal] = useState(null);
      const [scaleDecision, setScaleDecision] = useState('Scale');
      const [scaleJustification, setScaleJustification] = useState('');

      // Daily Update Form State
      const [updateTitle, setUpdateTitle] = useState('');
      const [updateDesc, setUpdateDesc] = useState('');
      const [updateProgress, setUpdateProgress] = useState(50);
      const [updateMediaType, setUpdateMediaType] = useState('photo');
      const [updateMediaUrl, setUpdateMediaUrl] = useState('');
      const [isPostingUpdate, setIsPostingUpdate] = useState(false);
      const [adminComments, setAdminComments] = useState({});

      // Expenditure Form State
      const [expCategory, setExpCategory] = useState('Cloud & Hardware');
      const [expDesc, setExpDesc] = useState('');
      const [expAmount, setExpAmount] = useState('');
      const [expDate, setExpDate] = useState(new Date().toISOString().split('T')[0]);
      const [expReceiptUrl, setExpReceiptUrl] = useState('');
      const [isPostingExp, setIsPostingExp] = useState(false);

      const fetchPilots = async () => {
        setLoading(true);
        try {
          const res = await fetch('/api/pilots');
          const json = await res.json();
          if (json.success && json.data) {
            setPilots(json.data);
            if (json.data.length > 0 && !selectedPilot) {
              setSelectedPilot(json.data[0]);
            } else if (selectedPilot) {
              const updated = json.data.find(p => p._id === selectedPilot._id);
              if (updated) setSelectedPilot(updated);
            }
          }
        } catch(err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchPilots();
      }, []);

      // Handle Camera / File Upload for Daily Update Evidence
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setUpdateMediaUrl(reader.result);
            if (file.type.startsWith('video/')) {
              setUpdateMediaType('video');
            } else {
              setUpdateMediaType('photo');
            }
          };
          reader.readAsDataURL(file);
        }
      };

      // Submit Daily Progress Update
      const handlePostDailyUpdate = async (e) => {
        e.preventDefault();
        if (!selectedPilot) return;
        if (!updateTitle.trim()) {
          alert('Please enter an update title');
          return;
        }

        setIsPostingUpdate(true);
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/daily-updates`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: updateTitle,
              description: updateDesc,
              progressPercentage: Number(updateProgress),
              mediaType: updateMediaType,
              mediaUrl: updateMediaUrl,
              uploadedBy: user && user.name ? `${user.name} (${selectedPilot.startupName})` : selectedPilot.startupName
            })
          });
          const json = await res.json();
          if (json.success) {
            alert('✅ Daily progress update with photo/video posted successfully!');
            setUpdateTitle('');
            setUpdateDesc('');
            setUpdateMediaUrl('');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
        finally { setIsPostingUpdate(false); }
      };

      // Admin Review Daily Update
      const handleAdminReviewUpdate = async (updateId) => {
        if (!selectedPilot) return;
        const comment = adminComments[updateId] || 'Reviewed and approved by Admin.';
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/daily-updates/${updateId}/review`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminComment: comment })
          });
          const json = await res.json();
          if (json.success) {
            alert('✅ Marked as Reviewed by Admin! The startup can now see your review tag.');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      // Log Team Expenditure
      const handlePostExpenditure = async (e) => {
        e.preventDefault();
        if (!selectedPilot) return;
        if (!expDesc.trim() || !expAmount) {
          alert('Please provide expense description and amount');
          return;
        }

        setIsPostingExp(true);
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/expenditures`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              category: expCategory,
              description: expDesc,
              amount: Number(expAmount),
              spendDate: expDate,
              receiptUrl: expReceiptUrl
            })
          });
          const json = await res.json();
          if (json.success) {
            alert('✅ Expenditure item logged successfully!');
            setExpDesc('');
            setExpAmount('');
            setExpReceiptUrl('');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
        finally { setIsPostingExp(false); }
      };

      const handleRequestPayment = async (milestoneId) => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/milestones/${milestoneId}/request-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ evidenceNotes, evidenceUrl })
          });
          const json = await res.json();
          if (json.success) {
            alert('✅ Payment Request submitted to Department Admin!');
            setActiveMilestoneModal(null);
            setEvidenceNotes('');
            setEvidenceUrl('');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleApprovePayment = async (milestoneId) => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/milestones/${milestoneId}/approve-payment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          const json = await res.json();
          if (json.success) {
            alert('🎉 Milestone Payment Approved & Funds Disbursed!');
            fetchPilots();
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleScaleDecisionSubmit = async () => {
        if (!selectedPilot) return;
        try {
          const res = await fetch(`/api/pilots/${selectedPilot._id}/scale-up-decision`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },

        function LoginPage({ setAuthUser }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      // Forgot Password State
      const [showForgotModal, setShowForgotModal] = useState(false);
      const [forgotIdentifier, setForgotIdentifier] = useState('');
      const [forgotOtp, setForgotOtp] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [forgotStep, setForgotStep] = useState(1); // 1: Send OTP, 2: Reset
      const [demoOtp, setDemoOtp] = useState('');

      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const json = await res.json();
          if (json.success) {
            setAuth(json.token, json.user);
            setAuthUser(json.user);
            if (json.user.role === 'admin') window.location.hash = '#/admin/dashboard';
            else window.location.hash = '#/pilots';
          } else {
            alert('Login failed: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleSendForgotOtp = async (e) => {
        e.preventDefault();
        if (!forgotIdentifier.trim()) {
          alert('Please enter registered Email ID or Company Name');
          return;
        }
        try {
          const res = await fetch('/api/auth/forgot-password-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ identifier: forgotIdentifier })
          });
          const json = await res.json();
          if (json.success) {
            setDemoOtp(json.otp);
            setForgotStep(2);
            alert(`🔑 OTP Sent! (Demo OTP Code: ${json.otp})`);
          } else {
            alert('Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      const handleResetPassword = async (e) => {
        e.preventDefault();
        if (!forgotOtp || !newPassword) {
          alert('Please enter the OTP and your new password.');
          return;
        }
        try {
          const res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: forgotIdentifier, otp: forgotOtp, newPassword })
          });
          const json = await res.json();
          if (json.success) {
            alert('🔒 Password Reset Successful! You can now log in with your new password.');
            setShowForgotModal(false);
            setForgotStep(1);
            setForgotIdentifier('');
            setForgotOtp('');
            setNewPassword('');
          } else {
            alert('Reset Error: ' + json.error);
          }
        } catch(err) { alert(err.message); }
      };

      return (
        <div className="max-w-md mx-auto px-4 py-16">
          <div className="bg-white border border-slate-200 rounded-3xl p-8 shadow-xl space-y-6">
            <h2 className="text-2xl font-bold text-slate-900 text-center">Login to GovBridge</h2>
            
            <form onSubmit={handleLogin} className="space-y-4 text-xs font-semibold text-slate-700">
              <div>
                <label>Email Address / Company Name (Username)</label>
                <input type="text" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={email} onChange={e=>setEmail(e.target.value)} placeholder="admin@govbridge.gov.in or AgriSense Innovations" />
              </div>
              <div>
                <div className="flex justify-between items-center">
                  <label>Password</label>
                  <button type="button" onClick={()=>setShowForgotModal(true)} className="text-blue-600 text-[11px] font-bold hover:underline">
                    Forgot Password?
                  </button>
                </div>
                <input type="password" required className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" />
              </div>
              <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm rounded-xl shadow-md transition">
                Sign In →
              </button>
            </form>

            <div className="text-center text-xs text-slate-500 pt-2 border-t border-slate-100">
              Default Admin: <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">admin@govbridge.gov.in</code> / <code className="bg-slate-100 px-1 py-0.5 rounded text-slate-800">Admin@123456</code>
            </div>
          </div>

          {/* Forgot Password Modal */}
          {showForgotModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl p-8 max-w-md w-full space-y-6 relative">
                <button onClick={()=>setShowForgotModal(false)} className="absolute top-6 right-6 font-bold text-slate-400">✕</button>
                
                <div>
                  <h3 className="text-lg font-bold text-slate-900">🔐 Reset Your Password</h3>
                  <p className="text-xs text-slate-500 mt-1">An OTP will be generated and verified to reset your password securely.</p>
                </div>

                {forgotStep === 1 ? (
                  <form onSubmit={handleSendForgotOtp} className="space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-slate-700">Registered Email ID or Company Name</label>
                      <input 
                        type="text"
                        required
                        className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600"
                        placeholder="contact@agrisense.in"
                        value={forgotIdentifier}
                        onChange={e=>setForgotIdentifier(e.target.value)}
                      />
                    </div>

                    <button type="submit" className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow-md">
                      📲 Send Password Reset OTP
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleResetPassword} className="space-y-4 text-xs">
                    {demoOtp && (
                      <div className="bg-emerald-50 border border-emerald-300 text-emerald-800 p-3 rounded-xl font-bold text-center">
                        Demo OTP: <span className="text-base tracking-widest text-emerald-900">{demoOtp}</span>
                      </div>
                    )}

                    <div>
                      <label className="font-bold text-slate-700">Enter 6-Digit OTP Code</label>
                      <input 
                        type="text"
                        required
                        className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600 text-center font-bold text-base tracking-widest"
                        placeholder="123456"
                        value={forgotOtp}
                        onChange={e=>setForgotOtp(e.target.value)}
                      />
                    </div>

                    <div>
                      <label className="font-bold text-slate-700">New Password</label>
                      <input 
                        type="password"
                        required
                        className="w-full mt-1 p-3 border border-slate-200 rounded-xl outline-none focus:border-blue-600"
                        placeholder="••••••••"
                        value={newPassword}
                        onChange={e=>setNewPassword(e.target.value)}
                      />
                    </div>

                    <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md">
                      🔒 Verify OTP & Reset Password
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    function Footer() {
      return (
        <footer className="bg-slate-900 text-slate-400 py-12 border-t border-slate-800 mt-20">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">

            <div className="text-xs text-slate-600 pt-4">© 2026 GovBridge. All rights reserved.</div>
          </div>
        </footer>

    }

    // MAIN APP ROUTER
    function App() {
      const [currentPath, setCurrentPath] = useState(window.location.hash.replace('#', '') || '/');
      const [authUser, setAuthUser] = useState(getUser());

      useEffect(() => {
        const handleHashChange = () => {
          setCurrentPath(window.location.hash.replace('#', '') || '/');
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Navbar currentPath={currentPath} user={authUser} />
            <main>
              {currentPath === '/' && <HomePage />}
              {currentPath === '/login' && <LoginPage setAuthUser={setAuthUser} />}
              {currentPath === '/startup/register' && <StartupRegisterPage />}
              {currentPath === '/problem-statements' && <ProblemStatementsPage />}
              {currentPath === '/pilots' && <PilotLifecyclePage user={authUser} />}
              {currentPath === '/how-it-works' && <HowItWorksPage />}
              {currentPath === '/admin/dashboard' && <AdminDashboardPage user={authUser} />}
            </main>
          </div>
          <Footer />
        </div>
      );
    }

    try {
      const rootElement = document.getElementById('root');
      if (ReactDOM.createRoot) {
        ReactDOM.createRoot(rootElement).render(<App />);
      } else if (ReactDOM.render) {
        ReactDOM.render(<App />, rootElement);
      }
    } catch(err) {
      console.error('Mounting Error:', err);
    }
  </script>
